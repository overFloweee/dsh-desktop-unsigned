name: package-macos-unsigned

# 在 GitHub Actions 上把**官方** DeepSeek Harness 桌面端打成 macOS 未签名 .app，
# 用于本地自用（官方 macOS 打包链要求 Developer ID 证书 + 公证，本流程刻意绕过）。
#
# 只做两件重活：
#   1) 官方 `pnpm run prepare:desktop`（= package-target --prepare-only，**不需要任何 Apple 凭据**）
#   2) 用 config/unsigned-mac.config.mjs 覆盖 electron-builder 的签名/公证设置，出 dir 目标（.app）
#
# 产物：`DeepSeek-Harness-<tag>-mac-arm64-unsigned.zip`（Actions artifact + Release）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '上游 tag（deepseek-ai/deepseek-harness）'
        required: false
        default: 'dsh-v0.1.7-alpha.1'
      publish_release:
        description: '把产物发布成 Release（方便直接下载）'
        type: boolean
        default: true
  # 想每天自动跟一版就把下面注释打开（默认关闭，避免白烧 CI 分钟）
  # schedule:
  #   - cron: '30 20 * * *'

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14            # Apple Silicon（arm64）
    timeout-minutes: 90

    env:
      # ── 目标 ──────────────────────────────────────────────
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: arm64
      # 自建壳的独立身份（官方壳是 com.deepseek.dsh），避免与官方安装互相干扰
      DSH_DESKTOP_APP_ID: com.deepseek.dsh.selfbuild
      # 下面两组更新/策略变量只是喂给官方工厂的"形状校验"（工厂无条件解析它们）；
      # config/unsigned-mac.config.mjs 会把 dshMandatoryUpdatePolicy 与 publish 从产物
      # 元数据里抹掉，所以它们不会真的进壳、也不会让壳去连测试环境
      DSH_DESKTOP_AUTO_UPDATE_ENV: test
      DOWNLOAD_TEST_ORIGIN: https://download-test.deepseek.com
      DOWNLOAD_TEST_RELEASE_ID: 0123456789abcdef0123456789abcdef
      # 强制更新策略：test 部署必须有 origin + allowedAuthOrigins（electron-builder 那步
      # 的配置工厂直接读 process.env，所以这里也必须给）
      DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN: https://harness-test.deepseek.com
      DSH_DESKTOP_MANDATORY_UPDATE_CONFIG: '{"allowedAuthOrigins":["https://harness-test.deepseek.com"]}'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # ── 让官方配置工厂能通过"形状校验"的假凭据（不会被真用）──
      DSH_DESKTOP_MACOS_SIGNING_IDENTITY: CI_UNSIGNED_BUILD
      DSH_DESKTOP_MACOS_TEAM_ID: AAAAAAAAAA
      APPLE_ID: ci@example.com
      APPLE_APP_SPECIFIC_PASSWORD: ci-not-a-real-password
      APPLE_TEAM_ID: AAAAAAAAAA

    steps:
      - name: 先看磁盘（并释放 Android SDK 等用不到的大件）
        run: |
          df -h / | tail -1
          sudo rm -rf ~/Library/Android/sdk || true
          rm -rf ~/.gradle ~/.cargo/registry/cache || true
          df -h / | tail -1

      - name: Checkout 本仓库（取构建配置）
        uses: actions/checkout@v4

      - name: Checkout 上游仓库（指定 tag）
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ inputs.tag }}
          path: src
          fetch-depth: 1

      - name: Setup Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: 启用 pnpm 11.7.0
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: 安装依赖
        working-directory: src
        run: pnpm install --no-frozen-lockfile

      # 官方在 darwin 上**无论 prepare-only 与否**都会 withMacOSSigningKeychain（把 p12 导入临时
      # keychain）。未签名自建构建不需要它，所以精确打一处补丁：直接调 packageTarget，不套 keychain。
      # 只改 CI 里的检出副本（上游仓库不动）。
      - name: 补丁：跳过 macOS keychain 导入（未签名构建用）
        working-directory: src
        run: python3 "$GITHUB_WORKSPACE/config/patch-package-target.py"

      # 上游从 0.1.7-alpha.1 起，apps/desktop/scripts/macos-notarization-proxy.ts 在**模块顶层**
      # 静态 import 了 @deepseek-ai/node-addon-system/lib/flock.js，而 native/system 的 lib/ 是
      # `tsc -b` 的产物、**不在 git 里**。package:desktop 自己那条链要在脚本跑起来之后才构建它，
      # 于是干净检出上 tsx 一加载脚本就 ERR_MODULE_NOT_FOUND。先单独编出来即可。
      - name: 构建 native/system 的 JS 产物（lib/ 不在 git 里）
        working-directory: src
        run: pnpm --dir native/system run build:ts

      # electron-builder 只收集 dependencies（workspace 包若只写在 devDependencies 会缺），
      # 先跑一次 desktop build 让链接就位；失败不致命，继续往下走。
      - name: 预构建 desktop 包（失败不致命）
        working-directory: src
        continue-on-error: true
        run: pnpm --filter @deepseek-ai/dsh-desktop run build

      # 官方 validateDesktopPackageEnvironment 在 darwin 上即使 prepare-only 也要求 CSC_LINK
      # 指向一个**可读文件**（这里只做可读性校验，不会真的用它签名）。生成一个一次性的
      # 自签名 p12，既通过校验，也不依赖任何真实证书。
      - name: 生成一次性自签名 p12（仅用于通过可读性校验）
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ci-key.pem -out /tmp/ci-cert.pem \
            -days 1 -nodes -subj "/CN=DSH CI Unsigned" 2>/dev/null
          openssl pkcs12 -export -out src/apps/desktop/ci-dummy.p12 \
            -inkey /tmp/ci-key.pem -in /tmp/ci-cert.pem -passout pass: 2>/dev/null
          ls -la src/apps/desktop/ci-dummy.p12
          openssl pkcs12 -info -in src/apps/desktop/ci-dummy.p12 -passin pass: -noout 2>&1 | head -3

      # 官方 package-target 要求发布字段只从 apps/desktop/.env.macos 读（不回落 shell env），
      # 干净检出上没有这个文件（.gitignore 掉了），先写进去。
      - name: 写入 apps/desktop/.env.macos
        run: |
          cp "$GITHUB_WORKSPACE/config/env.macos" src/apps/desktop/.env.macos
          echo "--- 已写入 ---"
          sed -n '1,24p' src/apps/desktop/.env.macos

      - name: 准备桌面目标（官方 prepare-only，无需 Apple 凭据）
        working-directory: src
        run: pnpm run prepare:desktop

      - name: 打未签名 .app（electron-builder --mac dir）
        working-directory: src/apps/desktop
        run: |
          cp "$GITHUB_WORKSPACE/config/unsigned-mac.config.mjs" ./unsigned-mac.config.mjs
          pnpm exec electron-builder --config unsigned-mac.config.mjs --mac dir
          echo "--- 产物 ---"
          find . -maxdepth 3 -name '*.app' -type d | head

      # 上游把 shell 运行时需要的三个包声明在 devDependencies 里，electron-builder 只收集
      # dependencies → 产物缺包、壳一启动就崩。补丁挪了依赖，这里再断言**产物里真的有**。
      - name: 校验产物依赖完整（防 shell 缺包导致首启崩溃）
        working-directory: src
        run: |
          APP=$(find apps/desktop/dist-unsigned -maxdepth 3 -name '*.app' -type d | head -1)
          python3 "$GITHUB_WORKSPACE/config/verify-app-deps.py" "$APP"

      - name: 收集产物
        id: collect
        run: |
          set -e
          APP=$(find src/apps/desktop/dist-unsigned -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没有找到 .app，打包步骤可能失败了"
            exit 1
          fi
          echo "找到: $APP"
          NAME="DeepSeek-Harness-${{ inputs.tag }}-mac-arm64-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NAME"
          shasum -a 256 "$NAME" | tee "$NAME.sha256"
          echo "zip=$NAME" >> "$GITHUB_OUTPUT"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-app
          path: |
            *.zip
            *.zip.sha256

      - name: 发布 Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="unsigned-${{ inputs.tag }}"
          NOTES="未签名 macOS arm64 构建，源码来自上游 ${{ inputs.tag }}。
          自建产物，**不是官方发布**：首次打开需要右键 → 打开，或执行
          \`xattr -dr com.apple.quarantine \"DeepSeek Harness (RC).app\"\`。
          无自动更新（app-update.yml 依赖签名）。
          干净壳：app id 为 com.deepseek.dsh.selfbuild、应用名带 (RC)、
          产物元数据里已抹掉强制更新策略与更新 feed。"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "$NOTES" *.zip *.zip.sha256 \
          || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber *.zip *.zip.sha256
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
